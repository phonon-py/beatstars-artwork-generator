        }

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-weight: 600;
            color: #2c3e50;
        }
        
        input, select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .generate-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            margin-bottom: 30px;
        }
        
        .generate-btn:hover {
            transform: translateY(-2px);
        }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .result-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border-left: 5px solid #667eea;
        }
        
        .result-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .copy-icon {
            cursor: pointer;
            color: #667eea;
            transition: color 0.2s;
        }
        
        .copy-icon:hover {
            color: #764ba2;
        }
        
        .prompt-text {
            background: white;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .analysis-section {
            background: #e8f4f8;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .tag {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .success-message.show {
            opacity: 1;
        }

            const keywords = title.toLowerCase()
                .replace(/[^\w\s]/g, ' ')
                .split(/\s+/)
                .filter(word => word.length > 2);
            return keywords;
        }

        function generateVisualElements(title, genre) {
            const keywords = extractKeywords(title);
            const elements = [];
            
            keywords.forEach(keyword => {
                if (visualElementsMap[keyword]) {
                    elements.push(visualElementsMap[keyword]);
                }
            });
            
            // ジャンル固有の要素を追加 - 2025年拡張版
            const genreElements = {
                'rage-trap': 'hypnotic distorted glitch patterns, opium aesthetic elements',
                'trap': 'urban luxury patterns, chrome 3D elements',
                'pluggnb': 'ethereal cloud textures, angelic sparkle effects',
                'plugg': 'dreamy haze effects, floating 3D objects',
                'hyperpop': 'chaotic digital artifacts, chrome hearts and stars',
                'glitchcore': 'heavy data moshing, RGB corruption effects',
                'phonk': 'cowboy skull motifs, VHS grain textures',
                'drift-phonk': 'JDM car elements, Tokyo drift speed effects',
                'memphis-phonk': 'occult symbols, cassette tape aesthetics',
                'drill': 'cold urban shadows, masked silhouettes',
                'ny-drill': 'NYC subway textures, borough street elements',
                'jersey-club': 'bouncy party elements, dynamic motion effects',
                'detroit-type': 'industrial decay textures, Michigan street elements',
                'melodic-hiphop': 'cinematic golden hour lighting, cloud formations',
                'emo-rap': 'rain textures, broken heart symbols',
                'rnb': 'smooth velvet textures, candlelit ambiance',
                'afrobeats': 'African pattern textures, cultural fusion elements',
                'latin-trap': 'tropical flame textures, Latin street elements',
                'uk-garage': 'liquid chrome textures, 2000s revival elements',
                'lofi': 'vintage vinyl textures, anime study room elements',
                'electronic': 'holographic interfaces, AI generated patterns',
                'house': 'disco ball reflections, sunset gradient elements',
                'ambient': 'vast landscape textures, organic nature elements'
            };
            
            if (genreElements[genre]) {
                elements.push(genreElements[genre]);
            }
            
            return elements.length > 0 ? elements.join(', ') : 'abstract musical patterns';
        }

        function generatePrompts() {
            const trackTitle = document.getElementById('trackTitle').value.trim();
            const genre = document.getElementById('genre').value;
            const mood = document.getElementById('mood').value;
            const bpm = document.getElementById('bpm').value;
            
            if (!trackTitle || !genre) {
                alert('楽曲タイトルとジャンルを入力してください');
                return;
            }
            
            const template = genreTemplates[genre];
            const visualElements = generateVisualElements(trackTitle, genre);
            const keywords = extractKeywords(trackTitle);
            
            // BPM効果を追加
            let bpmEffect = '';
            if (bpm) {
                const bpmCategory = getBPMCategory(parseInt(bpm));
                bpmEffect = bpmEffects[bpmCategory];
            }
            
            // メインプロンプト生成
            let mainPrompt = template.template
                .replace('[TRACK_TITLE]', trackTitle.toUpperCase())
                .replace('[VISUAL_ELEMENTS]', visualElements)
                .replace('[MOOD]', mood || 'dynamic');
            
            // BPM効果を追加
            if (bpmEffect) {
                mainPrompt = mainPrompt.replace('1024x1024 square format', `${bpmEffect}, 1024x1024 square format`);
            }
            
            // バリエーションプロンプト生成
            const variations = generateVariations(trackTitle, genre, mood, visualElements);
            
            // 結果表示
            displayResults({
                main: mainPrompt,
                variations: variations,
                analysis: {
                    keywords: keywords,
                    visualElements: visualElements,
                    colors: template.colors,
                    aesthetic: template.aesthetic,
                    typography: template.typography,
                    recommendedMoods: template.recommendedMoods || []
                }
            });
        }

        function generateVariations(title, genre, mood, visualElements) {
            const variations = [];
            const genreDisplay = genre.replace(/-/g, ' ');
            const template = genreTemplates[genre];

            // バリエーション1: 2025 AI Art Style
            variations.push({
                name: '2025 AI Art Style',
                prompt: `"${title.toUpperCase()}" ${genreDisplay} album cover 2025, ${visualElements}, AI generated art style, chrome 3D typography, iridescent holographic gradients, contemporary digital aesthetic, ${mood || 'dynamic'} atmosphere, hyper-detailed textures, professional layout, 1024x1024 square format`
            });

            // バリエーション2: Anti-Design / Experimental
            variations.push({
                name: 'Anti-Design版',
                prompt: `"${title.toUpperCase()}" experimental ${genreDisplay} cover 2025, deconstructed ${visualElements}, chaotic mixed typography, intentionally broken layout, anti-design aesthetic, raw ${mood || 'intense'} energy, glitch textures, underground art direction, 1024x1024 square format`
            });

            // バリエーション3: Luxury Minimal
            variations.push({
                name: 'Luxury Minimal版',
                prompt: `"${title.toUpperCase()}" luxury minimal ${genreDisplay} artwork 2025, refined ${visualElements}, elegant thin typography, sophisticated color palette, high-end fashion aesthetic, smooth ${mood || 'refined'} atmosphere, premium textures, gallery-worthy composition, 1024x1024 square format`
            });

            // バリエーション4: Y2K Revival (ジャンルに応じて追加)
            if (['pluggnb', 'hyperpop', 'glitchcore', 'electronic'].includes(genre)) {
                variations.push({
                    name: 'Y2K Revival版',
                    prompt: `"${title.toUpperCase()}" Y2K revival ${genreDisplay} cover 2025, nostalgic ${visualElements}, chrome bubble typography, early 2000s aesthetic with modern twist, ${mood || 'dreamy'} cyber vibes, glossy plastic textures, futuristic retro layout, 1024x1024 square format`
                });
            }

            return variations;
        }

        // ジャンル別おすすめムード更新機能
        function updateMoodOptions() {
            const genre = document.getElementById('genre').value;
            const moodHint = document.getElementById('moodHint');
            const moodSelect = document.getElementById('mood');

            if (!genre || !genreTemplates[genre]) {
                moodHint.textContent = '';
                return;
            }

            const template = genreTemplates[genre];
            const recommended = template.recommendedMoods;

            if (recommended && recommended.length > 0) {
                const moodLabels = {
                    'aggressive': 'Aggressive',
                    'dreamy': 'Dreamy',
                    'energetic': 'Energetic',
                    'chill': 'Chill',
                    'dark': 'Dark',
                    'luxury': 'Luxury',
                    'vintage': 'Vintage',
                    'futuristic': 'Futuristic',
                    'chaotic': 'Chaotic',
                    'ethereal': 'Ethereal',
                    'melancholic': 'Melancholic',
                    'hypnotic': 'Hypnotic',
                    'menacing': 'Menacing',
                    'nostalgic': 'Nostalgic',
                    'euphoric': 'Euphoric',
                    'gritty': 'Gritty'
                };

                const recommendedLabels = recommended.map(m => moodLabels[m] || m).join(', ');
                moodHint.textContent = `(おすすめ: ${recommendedLabels})`;
                moodHint.style.color = '#667eea';

                // おすすめのムードを選択状態にする
                if (!moodSelect.value) {
                    moodSelect.value = recommended[0];
                }
            } else {
                moodHint.textContent = '';
            }
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = `
                <div class="result-card">
                    <h3>
                        🎯 メインプロンプト
                        <span class="copy-icon" data-prompt="main">📋</span>
                    </h3>
                    <div class="analysis-section">
                        <strong>分析結果:</strong>
                        <div class="tags">
                            ${results.analysis.keywords.map(k => `<span class="tag">${k}</span>`).join('')}
                        </div>
                        <p><strong>視覚要素:</strong> ${results.analysis.visualElements}</p>
                        <p><strong>カラーパレット:</strong> ${results.analysis.colors}</p>
                        <p><strong>美学スタイル:</strong> ${results.analysis.aesthetic}</p>
                        <p><strong>タイポグラフィ:</strong> ${results.analysis.typography}</p>
                        ${results.analysis.recommendedMoods.length > 0 ? `<p><strong>おすすめムード:</strong> ${results.analysis.recommendedMoods.join(', ')}</p>` : ''}
                    </div>
                    <div class="prompt-text" id="prompt-main">${results.main}</div>
                </div>
                
                ${results.variations.map((variation, index) => `
                    <div class="result-card">
                        <h3>
                            🎨 ${variation.name}
                            <span class="copy-icon" data-prompt="variation-${index}">📋</span>
                        </h3>
                        <div class="prompt-text" id="prompt-variation-${index}">${variation.prompt}</div>
                    </div>
                `).join('')}
                
                <div class="result-card">
                    <h3>📋 使用手順</h3>
                    <div style="line-height: 1.6;">
                        <p><strong>1.</strong> 上記プロンプトをコピー</p>
                        <p><strong>2.</strong> Microsoft Copilot企業版にアクセス</p>
                        <p><strong>3.</strong> プロンプトを貼り付けて送信</p>
                        <p><strong>4.</strong> 4つの候補から最適なものを選択</p>
                        <p><strong>5.</strong> 必要に応じて微調整指示を追加</p>
                    </div>
                </div>
            `;
            
            // プロンプトデータをグローバル変数に保存
            window.promptData = {
                main: results.main,
                variations: results.variations
            };
            
            // コピーボタンにイベントリスナーを追加
            document.querySelectorAll('.copy-icon').forEach(icon => {
                icon.addEventListener('click', function() {
                    const promptType = this.getAttribute('data-prompt');
                    copyToClipboard(promptType);
                });
            });
        }

        function copyToClipboard(promptType) {
            let textToCopy = '';
            
            if (promptType === 'main') {
                textToCopy = window.promptData.main;
            } else if (promptType.startsWith('variation-')) {
                const index = parseInt(promptType.split('-')[1]);
                textToCopy = window.promptData.variations[index].prompt;
            }
            
            if (!textToCopy) {
                console.error('コピーするテキストが見つかりません');
                return;
            }
            
            // モダンブラウザのClipboard API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showSuccessMessage();
                }).catch(err => {
                    console.error('Clipboard APIでエラー:', err);
                    fallbackCopy(textToCopy);
                });
            } else {
                // フォールバック
                fallbackCopy(textToCopy);
            }
        }
        
        function fallbackCopy(text) {
            try {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                textArea.style.top = '-999999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                
                if (successful) {
                    showSuccessMessage();
                } else {
                    alert('コピーに失敗しました。手動でテキストをコピーしてください。');
                }
            } catch (err) {
                console.error('フォールバックコピーでエラー:', err);
                alert('コピーに失敗しました。手動でテキストをコピーしてください。');
            }
        }

        function showSuccessMessage() {
            const message = document.getElementById('successMessage');
            message.classList.add('show');
            setTimeout(() => {
                message.classList.remove('show');
            }, 2000);
        }

        // エンターキーでの実行
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generatePrompts();
            }
        });
    </script>
</body>
